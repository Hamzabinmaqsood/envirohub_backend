<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnviroHub Authority Login</title><style>body{margin:0;font-family:system-ui;background:#eef5f2;color:#18221f;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,92vw);background:white;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(15,66,52,.12)}h1{margin:0 0 6px}.muted{color:#68746f;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #ccd7d2;border-radius:10px;padding:12px;font:inherit}.btn{width:100%;border:0;background:#116149;color:white;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}.message{background:#fee4e2;color:#912018;padding:10px;border-radius:9px;margin-bottom:10px}</style></head><body><div class="box"><h1>EnviroHub</h1><div class="muted">Authority operations dashboard</div>{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<div class="field"><label>Email</label>{{ form.email }}</div><div class="field"><label>Password</label>{{ form.password }}</div><button class="btn">Sign in</button></form></div></body></html>

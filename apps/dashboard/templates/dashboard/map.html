{% extends 'dashboard/base.html' %}{% block title %}Live Map · EnviroHub{% endblock %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#map{height:72vh;border-radius:16px;border:1px solid #e2e8e5;background:#e8efec}</style>{% endblock %}{% block content %}<div class="topbar"><div><h1>Report map</h1><div class="muted">Geographic view of submitted environmental issues</div></div><form method="get"><select name="status" onchange="this.form.submit()"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if selected_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></form></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const points={{ points_json|safe }};const map=L.map('map').setView(points.length?[points[0].lat,points[0].lng]:[30.3753,69.3451],points.length?11:5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const bounds=[];for(const p of points){const marker=L.marker([p.lat,p.lng]).addTo(map);marker.bindPopup(`<b>${p.category}</b><br>${p.status}<br>${p.description}<br><a href="${p.url}">Open report</a>`);bounds.push([p.lat,p.lng]);}if(bounds.length>1)map.fitBounds(bounds,{padding:[30,30]});</script>{% endblock %}
